schemaVersion: goink.tuitest/v1alpha1
name: use-focus-demo/navigation
app: use-focus-demo
viewport:
  width: 100
  height: 30
environment:
  TERM: tmux-256color
  COLORTERM: ""
  FORCE_COLOR: "1"
capture:
  mode: screen
steps:
  - name: initial
    expect:
      file: use-focus-none.screen.golden
  - name: tab-01
    input:
      key: tab
    expect:
      file: use-focus-first.screen.golden
  - name: tab-02
    input:
      key: tab
    expect:
      file: use-focus-second.screen.golden
  - name: shift-tab-01
    input:
      key: shift-tab
    expect:
      file: use-focus-first.screen.golden
  - name: esc-reset-01
    input:
      key: esc
    expect:
      file: use-focus-none.screen.golden
  - name: shift-tab-02
    input:
      key: shift-tab
    expect:
      file: use-focus-third.screen.golden
  - name: tab-03
    input:
      key: tab
    expect:
      file: use-focus-first.screen.golden
  - name: esc-reset-02
    input:
      key: esc
    expect:
      file: use-focus-none.screen.golden
  - name: tab-04
    input:
      key: tab
    expect:
      file: use-focus-first.screen.golden
  - name: ctrl-c-exit
    input:
      key: ctrl-c
    exit:
      within: 5s
    expect:
      sameAsPrevious: true
