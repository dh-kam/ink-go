schemaVersion: goink.tuitest/v1alpha1
name: use-focus-with-id-demo/navigation
app: use-focus-with-id-demo
viewport:
  width: 100
  height: 30
environment:
  TERM: tmux-256color
  COLORTERM: ""
  FORCE_COLOR: "1"
capture:
  mode: screen
steps:
  - name: initial
    expect:
      file: use-focus-with-id-none.screen.golden
  - name: key-2
    input:
      text: "2"
    expect:
      file: use-focus-with-id-second.screen.golden
  - name: tab-01
    input:
      key: tab
    expect:
      file: use-focus-with-id-third.screen.golden
  - name: shift-tab-01
    input:
      key: shift-tab
    expect:
      file: use-focus-with-id-second.screen.golden
  - name: key-1
    input:
      text: "1"
    expect:
      file: use-focus-with-id-first.screen.golden
  - name: esc-reset-01
    input:
      key: esc
    expect:
      file: use-focus-with-id-none.screen.golden
  - name: shift-tab-02
    input:
      key: shift-tab
    expect:
      file: use-focus-with-id-third.screen.golden
  - name: key-3
    input:
      text: "3"
    expect:
      sameAsPrevious: true
  - name: tab-02
    input:
      key: tab
    expect:
      file: use-focus-with-id-first.screen.golden
  - name: esc-reset-02
    input:
      key: esc
    expect:
      file: use-focus-with-id-none.screen.golden
  - name: ctrl-c-exit
    input:
      key: ctrl-c
    exit:
      within: 5s
    expect:
      sameAsPrevious: true
